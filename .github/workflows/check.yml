name: Check sky.melloo.me
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: status-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node check.js
      - name: Commit results
        run: |
          git config user.name "status-bot"
          git config user.email "actions@github.com"
          git add data/history.json docs/index.html
          git diff --quiet --cached || git commit -m "Update status [skip ci]"
          git push
